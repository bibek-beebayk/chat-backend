{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
    <h1>Award / Deduct Points</h1>
    <p>Manually credit or debit a player's reward points balance. This is recorded as an "Adjustment" entry in the points ledger.</p>

    {% if success %}
    <div style="color: #0a7c2f; margin-bottom: 15px; padding: 10px; border: 1px solid #0a7c2f; background: #f2fff5;">
        {{ success }}
    </div>
    {% endif %}

    <form method="POST" style="max-width: 480px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button" style="padding: 6px 18px;">Apply</button>
    </form>
</div>
{% endblock %}
